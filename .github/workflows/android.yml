name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Replace App Icon
        run: |
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$dpi
            cp app/src/main/res/mipmap-hdpi/app_icon.png app/src/main/res/mipmap-$dpi/ic_launcher.png
            cp app/src/main/res/mipmap-hdpi/app_icon.png app/src/main/res/mipmap-$dpi/ic_launcher_round.png
          done

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yun-tv-app
          path: app/build/outputs/apk/debug/app-debug.apk
